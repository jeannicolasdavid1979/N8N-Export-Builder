[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-export-builder"
dynamic = ["version"]
description = "Atelier de workflows n8n deterministes appuyes sur Jev (TypeSafe AI), pour alleger les agents du Hub d'agents"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Hub d'agents" }]
keywords = ["n8n", "workflow", "jev", "typesafe", "llm", "openrouter", "ollama", "agents"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Natural Language :: French",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
n8n-export-builder = "n8n_builder.app:main"

[tool.setuptools.dynamic]
version = { attr = "n8n_builder.__version__" }

[tool.setuptools.packages.find]
include = ["n8n_builder*"]

[tool.setuptools.package-data]
"n8n_builder" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Builder seul, à côté d'un n8n existant. Définir N8NB_PASSWORD dans .env (voir .env.example).
# Depuis ce conteneur, un n8n installé sur la machine hôte se joint par http://host.docker.internal:5678.
services:
  builder:
    build: .
    ports:
      - "127.0.0.1:8790:8790"
    env_file: .env
    volumes:
      - builder-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  builder-data:
